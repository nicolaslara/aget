name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and publish, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=refs/tags/${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Package release tarball
        run: scripts/package-release.sh --target "${{ matrix.target }}"

      - name: Smoke packaged binary
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          name="aget-v${version}-${{ matrix.target }}"
          tmpdir="$(mktemp -d)"
          tar -xzf "dist/${name}.tar.gz" -C "$tmpdir"
          "$tmpdir/${name}/aget" --version
          AGET_HOME="$tmpdir/aget-home" "$tmpdir/${name}/aget" --envelope json doctor --quick
          test -f "$tmpdir/${name}/README.md"
          test -f "$tmpdir/${name}/LICENSE"
          test -f "$tmpdir/${name}/skills/aget/SKILL.md"
          test -x "$tmpdir/${name}/scripts/install-codex-skill.sh"
          rm -rf "$tmpdir"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aget-${{ matrix.target }}
          path: |
            dist/aget-v*-${{ matrix.target }}.tar.gz
            dist/aget-v*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate aggregate checksums
        run: |
          cd dist
          shasum -a 256 ./*.tar.gz | sort -k 2 > SHA256SUMS
          for file in ./*.tar.gz.sha256; do
            shasum -a 256 -c "$file"
          done
          shasum -a 256 -c SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          notes="workpads/post-migration/release-notes-${TAG}.md"
          if [[ ! -f "$notes" ]]; then
            notes="CHANGELOG.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$notes" \
              dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS
          fi
