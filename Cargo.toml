[package]
name = "aget"
version = "0.1.0"
edition = "2021"
description = "Local-first auth-aware agent web context CLI"
license = "MIT"
repository = "https://github.com/nicolaslara/aget"
readme = "README.md"
publish = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/src/**",
    "/tests/**",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ego-tree = "0.11"
html5ever = "0.39"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tungstenite = "0.29"
ureq = "3.3"
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"
