[package]
name = "aget"
version = "0.1.0"
edition = "2021"
description = "Local-first auth-aware agent web context CLI"
license = "MIT"
repository = "https://github.com/nicolaslara/aget"
readme = "README.md"
keywords = ["agent", "web", "cli", "markdown", "local-first"]
categories = ["command-line-utilities", "web-programming"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/src/**",
    "/tests/**",
    "/skills/aget/SKILL.md",
    "/integrations/cursor/aget.mdc",
    "/integrations/copilot/aget.instructions.md",
    "/.opencode/tools/aget.ts",
    "/.opencode/lib/aget_args.ts",
    "/scripts/install-agent-integrations.sh",
    "/scripts/install-codex-skill.sh",
]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ego-tree = "0.11"
html5ever = "0.39"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tungstenite = "0.29"
ureq = "3.3"
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"
